<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Curhat Ceria 🐰💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    margin: 0;
    font-family: "Comic Sans MS", "Segoe UI", sans-serif;
    background: linear-gradient(120deg, #ffefba, #ffffff);
    overflow-x: hidden;
}

/* ===== LOGIN PAGE ===== */
.login-page {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: fadeIn 1s ease;
}
.login-box {
    background: #fff0f5;
    padding: 35px;
    width: 350px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    border: 2px dashed #ff69b4;
}
.login-box h2 {
    color: #ff69b4;
    margin-bottom: 10px;
    animation: bounce 1s infinite alternate;
}
.login-box input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid #ffb6c1;
    font-size: 14px;
}
.login-box button {
    width: 95%;
    padding: 12px;
    border: none;
    border-radius: 15px;
    background: #ff69b4;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
.login-box button:hover {
    background: #ff1493;
}
.error {
    color: red;
    font-size: 14px;
    margin-top: 8px;
}

/* ===== DASHBOARD ===== */
.dashboard {
    display: none;
    padding: 20px;
    animation: fadeIn 1s ease;
}
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.header h1 {
    color: #ff69b4;
    font-size: 24px;
}
.logout {
    background: #ff5252;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 15px;
    cursor: pointer;
    font-weight: bold;
}

/* ===== FORM BOX ===== */
.form-box {
    margin-top: 30px;
    background: #fff0f5;
    padding: 30px;
    border-radius: 25px;
    max-width: 500px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    margin-left: auto;
    margin-right: auto;
    border: 2px dashed #ff69b4;
}
.form-box h2 {
    text-align: center;
    color: #ff1493;
    animation: bounce 1s infinite alternate;
}
.form-group {
    margin: 15px 0;
}
.form-group label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}
.form-group textarea,
.form-group select {
    width: 100%;
    padding: 10px;
    border-radius: 12px;
    border: 1px solid #ffb6c1;
    resize: none;
}
.submit-btn {
    width: 100%;
    padding: 12px;
    background: #ff69b4;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}
.submit-btn:hover {
    background: #ff1493;
}
.success {
    text-align: center;
    color: #2e7d32;
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

/* ===== ANIMASI ===== */
@keyframes bounce {
    from {transform: translateY(0);}
    to {transform: translateY(-8px);}
}
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
</style>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div class="login-page" id="loginPage">
    <div class="login-box">
        <h2>🐰 Curhat Ceria</h2>
        <p>Tempat aman buat kamu curhat 💌</p>
        <input type="text" id="username" placeholder="Nama kamu ✨">
        <input type="password" id="password" placeholder="Password 🔒">
        <button onclick="login()">Masuk 💖</button>
        <div class="error" id="errorMsg"></div>
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="dashboard" id="dashboardPage">
    <div class="header">
        <h1>🌈 Form Psikolog Remaja</h1>
        <button class="logout" onclick="logout()">Logout 🚪</button>
    </div>

    <div class="form-box">
        <h2>💬 Ceritakan Perasaanmu</h2>

        <div class="form-group">
            <label>😢 Apa yang sedang kamu rasakan?</label>
            <select id="perasaan">
                <option>Sedih 😔</option>
                <option>Capek 😩</option>
                <option>Kesepian 🥺</option>
                <option>Marah 😡</option>
                <option>Bingung 🤔</option>
                <option>Senang 😄</option>
            </select>
        </div>

        <div class="form-group">
            <label>📝 Cerita singkat tentang masalahmu</label>
            <textarea id="cerita" rows="4" placeholder="Ketik ceritamu di sini ya..."></textarea>
        </div>

        <div class="form-group">
            <label>🌟 Apa yang kamu harapkan?</label>
            <textarea id="harapan" rows="3" placeholder="Misalnya: ingin didengarkan, ingin saran, dll"></textarea>
        </div>

        <button class="submit-btn" onclick="kirim()">Kirim Cerita 💌</button>
        <div class="success" id="successMsg"></div>
    </div>
</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if(username !== "" && password === "soshum") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("dashboardPage").style.display = "block";
    } else {
        document.getElementById("errorMsg").innerText = "Nama harus diisi & password 'soshum' 😥";
    }
}

function logout() {
    document.getElementById("dashboardPage").style.display = "none";
    document.getElementById("loginPage").style.display = "flex";

    // Reset form
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("perasaan").selectedIndex = 0;
    document.getElementById("cerita").value = "";
    document.getElementById("harapan").value = "";
    document.getElementById("successMsg").innerText = "";
}

function kirim() {
    const cerita = document.getElementById("cerita").value.trim();
    const harapan = document.getElementById("harapan").value.trim();

    if(cerita === "" || harapan === "") {
        alert("Tolong isi semua kolom ya 😊");
        return;
    }

    alert("💖 Terima kasih sudah berbagi! Kamu nggak sendirian 🌈\nTetap semangat ya!");
    document.getElementById("successMsg").innerText = "💌 Cerita berhasil dikirim. Semangat selalu! 🌟";

    // Reset form setelah submit
    document.getElementById("perasaan").selectedIndex = 0;
    document.getElementById("cerita").value = "";
    document.getElementById("harapan").value = "";
}
</script>

</body>
</html>
